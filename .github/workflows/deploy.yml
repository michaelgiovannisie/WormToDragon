name: Deploy Conviction

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: |
          chmod +x backend/mvnw
          cd backend
          ./mvnw clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_API_URL: https://conviction.michaelsie.com/api
        run: |
          cd frontend
          npm ci
          npx vite build

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Deploy backend JAR
          scp -o StrictHostKeyChecking=no \
            backend/target/Conviction-0.0.1-SNAPSHOT.jar \
            ubuntu@$EC2_HOST:/opt/conviction/conviction.jar

          # Deploy frontend
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ubuntu@$EC2_HOST:/opt/conviction/frontend/

          # Restart services
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST \
            "sudo systemctl restart conviction && sudo systemctl reload nginx"
